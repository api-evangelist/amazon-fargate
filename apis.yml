apis:
  - name: Amazon Fargate API
    description: >-
      The Amazon Fargate API is accessed through Amazon ECS and enables you to run containers without managing servers
      or clusters. You can define tasks, configure networking and IAM policies, and deploy containerized applications
      with serverless compute capacity.
