name: Amazon Fargate
description: >-
  Amazon Fargate is a serverless compute engine for containers that works with both Amazon ECS and Amazon EKS. Fargate
  removes the need to provision and manage servers, letting you specify and pay for resources per application, and
  improves security through application isolation by design.
