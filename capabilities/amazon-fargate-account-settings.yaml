naftiko: 1.0.0-alpha2
info:
  label: Amazon Fargate API — Account Settings
  description: 'Amazon Fargate API — Account Settings. 2 operations. Lead operation: Amazon Fargate List Account Settings.
    Self-contained Naftiko capability covering one Amazon Fargate business surface.'
  tags:
  - Amazon Fargate
  - Account Settings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_FARGATE_API_KEY: AMAZON_FARGATE_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-fargate-account-settings
    baseUri: https://ecs.{region}.amazonaws.com
    description: Amazon Fargate API — Account Settings business capability. Self-contained, no shared references.
    resources:
    - name: '#ListAccountSettings'
      path: /#ListAccountSettings
      operations:
      - name: listaccountsettings
        method: POST
        description: Amazon Fargate List Account Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: '#PutAccountSetting'
      path: /#PutAccountSetting
      operations:
      - name: putaccountsetting
        method: POST
        description: Amazon Fargate Put Account Setting
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_FARGATE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-fargate-account-settings-rest
    port: 8080
    description: REST adapter for Amazon Fargate API — Account Settings. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/listaccountsettings
      name: listaccountsettings
      description: 'REST surface for #ListAccountSettings.'
      operations:
      - method: POST
        name: listaccountsettings
        description: Amazon Fargate List Account Settings
        call: amazon-fargate-account-settings.listaccountsettings
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/putaccountsetting
      name: putaccountsetting
      description: 'REST surface for #PutAccountSetting.'
      operations:
      - method: POST
        name: putaccountsetting
        description: Amazon Fargate Put Account Setting
        call: amazon-fargate-account-settings.putaccountsetting
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-fargate-account-settings-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Fargate API — Account Settings. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-fargate-list-account-settings
      description: Amazon Fargate List Account Settings
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: amazon-fargate-account-settings.listaccountsettings
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-fargate-put-account-setting
      description: Amazon Fargate Put Account Setting
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-fargate-account-settings.putaccountsetting
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
