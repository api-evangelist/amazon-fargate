components:
  securitySchemes:
    aws_signature_v4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS Signature Version 4 authentication. Include the Authorization header with the AWS4-HMAC-SHA256 signing algorithm.
  schemas:
    Tag:
      type: object
      description: A tag applied to an ECS resource
      properties:
        key:
          type: string
          description: The tag key
          example: Environment
        value:
          type: string
          description: The tag value
          example: production
    ClusterSetting:
      type: object
      description: A cluster setting
      properties:
        name:
          type: string
          description: Setting name
          example: containerInsights
        value:
          type: string
          description: Setting value
          example: enabled
    Cluster:
      type: object
      description: An Amazon ECS cluster
      properties:
        clusterArn:
          type: string
          description: The ARN of the cluster
          example: arn:aws:ecs:us-east-1:123456789012:cluster/my-fargate-cluster
        clusterName:
          type: string
          description: The name of the cluster
          example: my-fargate-cluster
        status:
          type: string
          description: Cluster status
          example: ACTIVE
          enum:
          - ACTIVE
          - PROVISIONING
          - DEPROVISIONING
          - FAILED
          - INACTIVE
        registeredContainerInstancesCount:
          type: integer
          description: Number of registered container instances
          example: 0
        runningTasksCount:
          type: integer
          description: Number of running tasks
          example: 5
        pendingTasksCount:
          type: integer
          description: Number of pending tasks
          example: 0
        activeServicesCount:
          type: integer
          description: Number of active services
          example: 2
        tags:
          type: array
          description: Tags associated with the cluster
          items:
            $ref: '#/components/schemas/Tag'
        settings:
          type: array
          description: Cluster settings
          items:
            $ref: '#/components/schemas/ClusterSetting'
    TaskDefinition:
      type: object
      description: An Amazon ECS task definition
      properties:
        taskDefinitionArn:
          type: string
          description: Full ARN of the task definition
          example: arn:aws:ecs:us-east-1:123456789012:task-definition/my-fargate-task:1
        family:
          type: string
          description: Family of the task definition
          example: my-fargate-task
        revision:
          type: integer
          description: Revision number
          example: 1
        status:
          type: string
          description: Task definition status
          example: ACTIVE
          enum:
          - ACTIVE
          - INACTIVE
          - DELETE_IN_PROGRESS
        requiresCompatibilities:
          type: array
          description: Launch types the task definition is compatible with
          items:
            type: string
          example:
          - FARGATE
        networkMode:
          type: string
          description: Docker networking mode
          example: awsvpc
          enum:
          - bridge
          - host
          - awsvpc
          - none
        cpu:
          type: string
          description: Number of cpu units
          example: '256'
        memory:
          type: string
          description: Amount of memory in MiB
          example: '512'
        executionRoleArn:
          type: string
          description: ARN of task execution role
          example: arn:aws:iam::123456789012:role/ecsTaskExecutionRole
        taskRoleArn:
          type: string
          description: ARN of task IAM role
          example: arn:aws:iam::123456789012:role/ecsTaskRole
        containerDefinitions:
          type: array
          description: Container definitions
          items:
            $ref: '#/components/schemas/ContainerDefinition'
    ContainerDefinition:
      type: object
      description: Container definition for a task
      properties:
        name:
          type: string
          description: Container name
          example: my-container
        image:
          type: string
          description: Docker image
          example: nginx:latest
        essential:
          type: boolean
          description: Whether container is essential
          example: true
        cpu:
          type: integer
          description: CPU units for the container
          example: 256
        memory:
          type: integer
          description: Memory limit in MiB
          example: 512
        environment:
          type: array
          description: Environment variables
          items:
            $ref: '#/components/schemas/KeyValuePair'
        portMappings:
          type: array
          description: Port mappings
          items:
            $ref: '#/components/schemas/PortMapping'
        logConfiguration:
          $ref: '#/components/schemas/LogConfiguration'
    PortMapping:
      type: object
      description: Port mapping for a container
      properties:
        containerPort:
          type: integer
          description: Container port
          example: 80
        hostPort:
          type: integer
          description: Host port
          example: 80
        protocol:
          type: string
          description: Protocol
          example: tcp
          enum:
          - tcp
          - udp
    KeyValuePair:
      type: object
      description: A key-value pair
      properties:
        name:
          type: string
          description: Key name
          example: LOG_LEVEL
        value:
          type: string
          description: Key value
          example: INFO
    LogConfiguration:
      type: object
      description: Log configuration for a container
      properties:
        logDriver:
          type: string
          description: Log driver
          example: awslogs
          enum:
          - json-file
          - syslog
          - journald
          - gelf
          - fluentd
          - awslogs
          - splunk
          - awsfirelens
        options:
          type: object
          description: Log driver options
          additionalProperties:
            type: string
    NetworkConfiguration:
      type: object
      description: Network configuration for the task
      properties:
        awsvpcConfiguration:
          $ref: '#/components/schemas/AwsVpcConfiguration'
    AwsVpcConfiguration:
      type: object
      description: VPC configuration for awsvpc network mode
      required:
      - subnets
      properties:
        subnets:
          type: array
          description: Subnets for the task
          items:
            type: string
          example:
          - subnet-12345678
        securityGroups:
          type: array
          description: Security groups
          items:
            type: string
          example:
          - sg-12345678
        assignPublicIp:
          type: string
          description: Whether to assign a public IP
          example: ENABLED
          enum:
          - ENABLED
          - DISABLED
    Task:
      type: object
      description: An Amazon ECS task running on Fargate
      properties:
        taskArn:
          type: string
          description: ARN of the task
          example: arn:aws:ecs:us-east-1:123456789012:task/my-fargate-cluster/abc123
        clusterArn:
          type: string
          description: ARN of the cluster
          example: arn:aws:ecs:us-east-1:123456789012:cluster/my-fargate-cluster
        taskDefinitionArn:
          type: string
          description: ARN of the task definition
          example: arn:aws:ecs:us-east-1:123456789012:task-definition/my-fargate-task:1
        lastStatus:
          type: string
          description: Last known status
          example: RUNNING
          enum:
          - PROVISIONING
          - PENDING
          - ACTIVATING
          - RUNNING
          - DEACTIVATING
          - STOPPING
          - DEPROVISIONING
          - STOPPED
          - DELETED
        desiredStatus:
          type: string
          description: Desired status
          example: RUNNING
        launchType:
          type: string
          description: Launch type
          example: FARGATE
          enum:
          - EC2
          - FARGATE
          - EXTERNAL
        cpu:
          type: string
          description: CPU units
          example: '256'
        memory:
          type: string
          description: Memory in MiB
          example: '512'
        createdAt:
          type: string
          format: date-time
          description: Time task was created
          example: '2026-04-19T12:00:00Z'
        startedAt:
          type: string
          format: date-time
          description: Time task started running
          example: '2026-04-19T12:00:30Z'
        stoppedAt:
          type: string
          format: date-time
          description: Time task stopped
        stoppedReason:
          type: string
          description: Reason task stopped
        networkInterfaces:
          type: array
          description: Network interfaces
          items:
            type: object
        tags:
          type: array
          description: Tags
          items:
            $ref: '#/components/schemas/Tag'
    Service:
      type: object
      description: An Amazon ECS service
      properties:
        serviceArn:
          type: string
          description: ARN of the service
          example: arn:aws:ecs:us-east-1:123456789012:service/my-fargate-cluster/my-fargate-service
        serviceName:
          type: string
          description: Name of the service
          example: my-fargate-service
        clusterArn:
          type: string
          description: ARN of the cluster
          example: arn:aws:ecs:us-east-1:123456789012:cluster/my-fargate-cluster
        taskDefinition:
          type: string
          description: Task definition ARN or family:revision
          example: my-fargate-task:1
        desiredCount:
          type: integer
          description: Desired number of tasks
          example: 2
        runningCount:
          type: integer
          description: Number of running tasks
          example: 2
        pendingCount:
          type: integer
          description: Number of pending tasks
          example: 0
        status:
          type: string
          description: Service status
          example: ACTIVE
          enum:
          - ACTIVE
          - DRAINING
          - INACTIVE
        launchType:
          type: string
          description: Launch type
          example: FARGATE
        networkConfiguration:
          $ref: '#/components/schemas/NetworkConfiguration'
        loadBalancers:
          type: array
          description: Load balancer configurations
          items:
            $ref: '#/components/schemas/LoadBalancer'
        createdAt:
          type: string
          format: date-time
          description: Service creation time
        tags:
          type: array
          description: Tags
          items:
            $ref: '#/components/schemas/Tag'
    LoadBalancer:
      type: object
      description: Load balancer configuration for a service
      properties:
        targetGroupArn:
          type: string
          description: Target group ARN
          example: arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/my-tg/abc123
        loadBalancerName:
          type: string
          description: Load balancer name
        containerName:
          type: string
          description: Container name
          example: my-container
        containerPort:
          type: integer
          description: Container port
          example: 80
    AccountSetting:
      type: object
      description: An ECS account setting
      properties:
        name:
          type: string
          description: Setting name
          example: containerInsights
        value:
          type: string
          description: Setting value
          example: enabled
        principalArn:
          type: string
          description: Principal ARN
          example: arn:aws:iam::123456789012:root
    Failure:
      type: object
      description: A failure returned by an API operation
      properties:
        arn:
          type: string
          description: ARN of the resource that failed
          example: arn:aws:ecs:us-east-1:123456789012:cluster/missing-cluster
        reason:
          type: string
          description: Reason for the failure
          example: MISSING
        detail:
          type: string
          description: Additional detail about the failure
    ErrorResponse:
      type: object
      description: Error response from the Amazon ECS API
      properties:
        __type:
          type: string
          description: Error type
          example: InvalidParameterException
        message:
          type: string
          description: Error message
          example: The specified cluster is not in the ACTIVE state.
    CreateClusterRequest:
      type: object
      description: Request for CreateCluster operation
      properties:
        clusterName:
          type: string
          description: Cluster name
          example: my-fargate-cluster
        tags:
          type: array
          description: Tags to apply
          items:
            $ref: '#/components/schemas/Tag'
        settings:
          type: array
          description: Cluster settings
          items:
            $ref: '#/components/schemas/ClusterSetting'
        configuration:
          type: object
          description: Cluster configuration
        capacityProviders:
          type: array
          description: Capacity providers
          items:
            type: string
        defaultCapacityProviderStrategy:
          type: array
          description: Default capacity provider strategy
          items:
            type: object
    CreateClusterResponse:
      type: object
      description: Response from CreateCluster
      properties:
        cluster:
          $ref: '#/components/schemas/Cluster'
    DescribeClustersRequest:
      type: object
      description: Request for DescribeClusters
      properties:
        clusters:
          type: array
          description: Cluster names or ARNs
          items:
            type: string
        include:
          type: array
          description: Additional data to include
          items:
            type: string
    DescribeClustersResponse:
      type: object
      description: Response from DescribeClusters
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/Failure'
    ListClustersRequest:
      type: object
      description: Request for ListClusters
      properties:
        nextToken:
          type: string
          description: Pagination token
        maxResults:
          type: integer
          description: Maximum results
          example: 10
    ListClustersResponse:
      type: object
      description: Response from ListClusters
      properties:
        clusterArns:
          type: array
          description: List of cluster ARNs
          items:
            type: string
        nextToken:
          type: string
          description: Pagination token for next page
    DeleteClusterRequest:
      type: object
      required:
      - cluster
      description: Request for DeleteCluster
      properties:
        cluster:
          type: string
          description: Cluster name or ARN
          example: my-fargate-cluster
    DeleteClusterResponse:
      type: object
      description: Response from DeleteCluster
      properties:
        cluster:
          $ref: '#/components/schemas/Cluster'
    RegisterTaskDefinitionRequest:
      type: object
      required:
      - family
      - containerDefinitions
      description: Request for RegisterTaskDefinition
      properties:
        family:
